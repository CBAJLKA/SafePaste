name: Предложение
description: Новая возможность или улучшение
labels: [предложение]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу это решает
      description: Опишите ситуацию, в которой сейчас неудобно или чего не хватает.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Как это могло бы работать
  - type: textarea
    id: alternatives
    attributes:
      label: Что пробовали вместо этого
